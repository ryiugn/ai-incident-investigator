[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-incident-investigator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["opentelemetry-sdk==1.45.0", "pydantic==2.13.5", "langgraph==1.2.12", "langgraph-checkpoint-sqlite==3.1.1", "fastapi==0.142.2", "uvicorn==0.54.0", "httpx==0.28.1", "anthropic==1.11.0", "psycopg[binary,pool]==3.3.6"]

[project.scripts]
investigator = "investigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires running local Compose environment"]
